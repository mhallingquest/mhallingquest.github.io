# Site settings
name: "Milele Hallingquest - AI Automation"
bio: "AI Automation Engineer | Building intelligent workflows that save time & drive ROI"
url: "https://mhallingquest.github.io"   # your GitHub Pages URL
location: "Remote/Atlanta"

remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "dark"  # "default", "air", "contrast", "dark", "mint"

# Analytics
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-RY0EYLPQNJ"
    anonymize_ip: true

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap

# Author
author:
  name: "Milele Hallingquest"
  avatar: "/assets/img/avatar.png"   # add an image or remove this line
  bio: "I build AI-powered automations that transform manual workflows into intelligent systems."
  location: "Remote / Atlanta"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://mhallingquest.github.io"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/milelehallingquest/"
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:milelehallingquest@gmail.com"

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      classes: wide

# Navigation (header)
nav:
  - title: "Projects"
    url: "/projects/"
  - title: "About"
    url: "/about/"
  - title: "Resume"
    url: "/resume/"
  - title: "ScholarDollarz"
    url: "https://scholardollarz.com"

# Collections (optional for case studies)
collections:
  case_studies:
    output: true
    permalink: /case-studies/:path/

#Include
include:
  - _pages

# Exclusions
exclude:
  - README.md
